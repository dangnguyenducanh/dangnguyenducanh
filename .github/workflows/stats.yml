# Rebuilds assets/stats.svg and assets/munch.svg from the GitHub API once a day.
name: refresh stats cards

on:
  schedule:
    - cron: "17 0 * * *"  # 07:17 in Hanoi
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: stats
  cancel-in-progress: true

jobs:
  stats:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install fonttools==4.68.0
      - run: python assets/make_stats.py
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Commit if the cards changed
        run: |
          if [ -z "$(git status --porcelain -- assets/stats.svg assets/munch.svg)" ]; then echo "no change"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/stats.svg assets/munch.svg
          git commit -m "Refresh stats cards"
          git push
